name: e2e-playwright

# Brings up the whole stack with Docker Compose (offline rules router, NO Anthropic key), runs the Playwright
# suite in e2e/, and uploads the HTML report, traces and screenshots when anything fails.
# Heavier than ci.yml (models ~780 MB, a real 2-minute alert window), so it runs on demand and on changes to
# the parts it tests, not on every push.
on:
  workflow_dispatch:
  pull_request:
    paths: ["e2e/**", "web/**", "voice/**", "agent/**", "grafana/**", "fleet_sim/**", "docker-compose.yml", ".github/workflows/e2e.yml"]
  push:
    branches: [e2e-playwright]
    paths: ["e2e/**", "web/**", ".github/workflows/e2e.yml"]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Configure the stack (offline rules backend, no API key)
        working-directory: .
        run: |
          cp .env.example .env
          echo "LLM_BACKEND=rules" >> .env   # forces the rules router even if a key were present

      - name: Cache speech models (Whisper small + Piper voices, ~780 MB)
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/download_models.py') }}

      - name: Build and start the stack
        working-directory: .
        run: docker compose up -d --build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the suite and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for the voice app (first start downloads the models when the cache is cold)
        working-directory: .
        run: |
          for i in $(seq 1 180); do curl -fsS http://127.0.0.1:17860/health && exit 0; sleep 5; done
          docker compose logs --tail 80 voice-app; exit 1

      - name: Run the Playwright suite
        run: npx playwright test

      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Upload traces and screenshots (failures only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 14

      - name: Stack logs on failure
        if: ${{ failure() }}
        working-directory: .
        run: docker compose logs --tail 100 voice-app grafana fleet-sim
