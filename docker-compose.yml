# fleet-voice-agent: the whole stack with one command (`docker compose up -d`).
# Host ports are high and bound to 127.0.0.1 by default (shared server); change them in .env.
# Memory budget (mem_limit): VM 256m + Grafana 320m + sim 64m + n8n 512m + app 1700m ≈ 2.85 GB.
name: fleet-voice-agent

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    restart: unless-stopped
    command:
      - "-storageDataPath=/storage"
      - "-search.latencyOffset=5s"
      - "-retentionPeriod=7d"
      - "-memory.allowedPercent=40"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VM_PORT:-18428}:8428"
    volumes:
      - vm_data:/storage
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    depends_on: [victoriametrics]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 320m
    cpus: "0.5"

  fleet-sim:
    build:
      context: .
      dockerfile: fleet_sim/Dockerfile
    image: fleet-voice-agent-sim:local
    restart: unless-stopped
    depends_on: [victoriametrics]
    environment:
      VM_URL: http://victoriametrics:8428
      PUSH_INTERVAL: ${PUSH_INTERVAL:-5}
      FLAP_PROB_PER_MIN: ${FLAP_PROB_PER_MIN:-0.01}
      BREACH_BURST_PROB_PER_MIN: ${BREACH_BURST_PROB_PER_MIN:-0.05}
      CHAOS_FILE: /state/chaos.json
    volumes:
      - ./state:/state
    mem_limit: 64m
    cpus: "0.25"

  alerts-init:
    # One-shot: makes ./alerts_out writable for n8n, which runs as a non-root user.
    # Needed on Linux (fresh clones) and under rootless Podman; harmless on Docker Desktop.
    image: busybox:1.36
    command: ["sh", "-c", "chmod 0777 /alerts_out"]
    volumes:
      - ./alerts_out:/alerts_out
    restart: "no"
    mem_limit: 16m

  n8n:
    image: n8nio/n8n:1.123.99
    restart: unless-stopped
    depends_on: [alerts-init]
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      N8N_PORT: 5678
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"     # the workflow reads TELEGRAM_* / ALERT_LANG from env
      NODE_FUNCTION_ALLOW_BUILTIN: fs           # the "Log alert" Code node appends to alerts.log
      N8N_RESTRICT_FILE_ACCESS_TO: /alerts_out
      N8N_RUNNERS_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
      VOICE_APP_URL: http://voice-app:7860
      ALERT_LANG: ${ALERT_LANG:-en}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${N8N_PORT:-15678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/start.sh:/start.sh:ro
      - ./alerts_out:/alerts_out
    mem_limit: 512m
    cpus: "0.5"

  voice-app:
    build: .
    image: fleet-voice-agent-app:local
    restart: unless-stopped
    depends_on: [victoriametrics]
    environment:
      VM_URL: http://victoriametrics:8428
      LLM_BACKEND: ${LLM_BACKEND:-auto}          # auto = anthropic if ANTHROPIC_API_KEY is set, else offline rules
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OMP_NUM_THREADS: "1"
      STT_THREADS: ${STT_THREADS:-1}
      MODELS_DIR: /app/models
      CHAOS_FILE: /state/chaos.json             # lets `docker compose exec voice-app python -m evals.run_eval` drive the sim
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-17860}:7860"
    volumes:
      - ./models:/app/models
      - ./state:/state
      - ./evals:/app/evals
    mem_limit: 1700m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:7860/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  vm_data:
  grafana_data:
  n8n_data:
