# Grafana-managed alert rules (adapted from fleet-health-monitor's DeviceOffline rule and
# swift-mt103-monitor's "swift.sla.breaches > 0" alert).
apiVersion: 1
groups:
  - orgId: 1
    name: fleet-health
    folder: Device Fleet
    interval: 10s
    rules:
      - uid: device-silent
        title: DeviceSilent
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
          kind: device_silent
        annotations:
          summary: 'Device {{ $labels.device_id }} has been silent for {{ printf "%.0f" $values.B.Value }} s'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              refId: A
              datasource: {type: prometheus, uid: victoriametrics}
              expr: max by (device_id) (time() - tlast_over_time(device_uptime_seconds{job="fleet-sim"}[1d]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [120]}
              datasource: {type: __expr__, uid: __expr__}
      - uid: sla-breaches
        title: PaymentSLABreaches
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          kind: sla_breach
        annotations:
          summary: '{{ printf "%.0f" $values.B.Value }} payment SLA breaches in the last 5 minutes'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              refId: A
              datasource: {type: prometheus, uid: victoriametrics}
              expr: sum(increase(swift_sla_breaches_total[5m])) or vector(0)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
              datasource: {type: __expr__, uid: __expr__}
